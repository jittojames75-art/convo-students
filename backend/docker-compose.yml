version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: convosis_postgres
    restart: always
    environment:
      POSTGRES_DB: convosis_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: convosis_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@convosis.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:


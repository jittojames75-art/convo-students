databases:
  - name: convosis-postgres
    databaseName: convosis_db
    user: convosis_admin
    plan: free

services:
  # 1. Django REST Backend Web Service
  - type: web
    name: convosis-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn convosis_backend.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: convosis-postgres
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"

  # 2. React Vite Frontend Static Site
  - type: web
    name: convosis-frontend
    runtime: static
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

